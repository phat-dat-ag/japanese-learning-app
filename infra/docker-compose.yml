services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: japanese-learning-backend
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: japanese-learning-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend