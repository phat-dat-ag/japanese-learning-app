quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}

quarkus.datasource.reactive.url=mysql://localhost:3307/${DB_NAME}

quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3307/${DB_NAME}
quarkus.flyway.migrate-at-start=true

quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true

quarkus.swagger-ui.always-include=true

quarkus.swagger-ui.path=/swagger
quarkus.smallrye-openapi.info-title=Japanese Learning API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API documentation