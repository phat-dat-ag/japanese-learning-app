<div class="mx-auto h-[460px] max-w-xl [perspective:1000px]">
    <button type="button"
        class="relative h-full w-full text-left transition-transform duration-500 [transform-style:preserve-3d]"
        [class.[transform:rotateY(180deg)]]="flipped()" (click)="flip.emit()">
        <section
            class="absolute inset-0 flex flex-col items-center justify-center rounded-3xl border bg-white p-8 shadow-sm [backface-visibility:hidden]">
            <p class="mb-4 rounded-full bg-blue-50 px-4 py-1 text-sm font-medium text-blue-700">
                {{ vocabulary().jlptLevel }} · {{ vocabulary().partOfSpeech }}
            </p>

            <h2 class="text-5xl font-bold text-slate-900">
                {{ vocabulary().kana }}
            </h2>

            @if (vocabulary().kanji) {
            <p class="mt-3 text-xl text-slate-400">
                {{ vocabulary().kanji }}
            </p>
            }

            <p class="mt-6 text-sm text-slate-400">Click to reveal meaning</p>
        </section>

        <section
            class="absolute inset-0 rounded-3xl border bg-white p-7 shadow-sm [backface-visibility:hidden] [transform:rotateY(180deg)]">
            @if (detail()) {
            <div class="flex h-full flex-col justify-between">
                <div class="space-y-4">
                    <div>
                        <p class="text-3xl font-bold text-slate-900">
                            {{ detail()!.kana }}
                        </p>

                        @if (detail()!.kanji) {
                        <p class="mt-1 text-lg text-slate-500">
                            {{ detail()!.kanji }}
                        </p>
                        }

                        <p class="mt-1 text-sm text-slate-400">
                            {{ detail()!.romaji }}
                        </p>
                    </div>

                    <div class="rounded-2xl bg-slate-50 p-4 text-sm">
                        <p><span class="font-semibold">EN:</span> {{ detail()!.meaningEn }}</p>
                        <p class="mt-1"><span class="font-semibold">VI:</span> {{ detail()!.meaningVi }}</p>
                    </div>

                    @if (detail()!.exampleSentences.length > 0) {
                    <div class="space-y-2">
                        <h3 class="font-semibold text-slate-900">Example</h3>

                        @for (example of detail()!.exampleSentences; track example.id) {
                        <div class="rounded-2xl border p-4">
                            <p class="text-base text-slate-900"
                                [innerHTML]="highlightedSentence(example.sentenceJp, example.highlightText)"></p>
                            <p class="mt-2 text-sm text-slate-600">{{ example.sentenceEn }}</p>
                            <p class="text-sm text-slate-600">{{ example.sentenceVi }}</p>
                        </div>
                        }
                    </div>
                    }
                </div>

                <p class="pt-3 text-center text-sm text-slate-400">
                    Click again to flip back
                </p>
            </div>
            } @else {
            <div class="flex h-full items-center justify-center text-slate-500">
                Loading detail...
            </div>
            }
        </section>
    </button>
</div>
